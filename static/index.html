 <!doctype html>
<html>
<head>
	<title>BSOI semestral project</title>
	<meta charset='utf-8'>
	<link rel="stylesheet" href="main.css" type="text/css" media="all">
	<script src="capture.js">
	</script>
</head>
<body>
<div class="contentarea">
	<h1>
		Log in with camera or password
	</h1>
  <div class="camera">
    <video id="video">Video stream not available.</video>
  </div>
  <div class="buttons">
    <!--<button id="startbutton">Take photo</button>-->
    <button id="recognizebutton">Recognize</button> 
  </div>
  <p id="results">&nbsp;</p>
  <div id="auth-section">
    <h3>Registration:</h3>
    <input type="text" id="regUser" placeholder="Username">
    <input type="password" id="regPass" placeholder="Password">
    <button onclick="authAction('/register', 'regUser', 'regPass')">Register</button>

    <h3>Login with password:</h3>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="authAction('/login', 'loginUser', 'loginPass')">Login</button>
  </div>
  
  
  <canvas id="canvas">
  </canvas>
</div>
</body>
</html>
